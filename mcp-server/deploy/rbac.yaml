apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-mcp-sa
  labels:
    app.kubernetes.io/part-of: agent-lens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mlflow-mcp-server-mlflow-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-integration
subjects:
  - kind: ServiceAccount
    name: mlflow-mcp-sa
    namespace: agent-lens
