apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-mcp-server
  labels:
    app: mlflow-mcp-server
    app.kubernetes.io/name: mlflow-mcp-server
    app.kubernetes.io/part-of: agent-lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-mcp-server
  template:
    metadata:
      labels:
        app: mlflow-mcp-server
        app.kubernetes.io/name: mlflow-mcp-server
    spec:
      serviceAccountName: mlflow-mcp-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow-mcp
          image: quay.io/rrbanda/agent-lens-mcp:v2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: mlflow-mcp-config
                  key: tracking-uri
            - name: MLFLOW_TRACKING_TOKEN_FILE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
            - name: REQUESTS_CA_BUNDLE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: JUDGE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: mlflow-mcp-config
                  key: judge-model
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-lens-llm-key
                  key: api-key
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
