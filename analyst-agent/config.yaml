model:
  default: "gemini-2.5-flash"
  provider: gemini
mcp_servers:
  mlflow:
    url: "http://mlflow-mcp-server.redhat-ods-applications.svc.cluster.local:8080/mcp"
    timeout: 180
    connect_timeout: 60
    supports_parallel_tool_calls: true
    tools:
      resources: false
      prompts: false
dashboard:
  basic_auth:
    username: admin
    password_hash: "PLACEHOLDER"
platforms:
  api_server:
    enabled: true
    extra:
      port: 8642
      key: "agent-lens-api-key-2026"
  webhook:
    enabled: false
gateway:
  enabled: true
tools:
  code_execution:
    enabled: "on"
    backend: local
  file_operations:
    enabled: "on"
  web_search:
    enabled: "off"
  browser:
    enabled: "off"
toolsets:
  skills: true
  memory: true
  session_search: true
  delegation: true
  cronjob: false
  kanban: false
delegation:
  max_concurrent_children: 3
memory:
  enabled: true
  providers: []
skills:
  enabled: true
  directory: /tmp/work/.hermes/skills
  curator:
    enabled: true
api_server_key: "agent-lens-api-key-2026"
