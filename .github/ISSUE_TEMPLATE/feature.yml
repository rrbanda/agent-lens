name: Feature request
description: Propose a new capability or enhancement
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user outcome
      description: What job does this unblock for a platform team?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      value: |
        -
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - mcp
        - hermes
        - gateway
        - audit
        - registry
        - instrumentation
        - deploy
        - ci
        - docs
        - security
    validations:
      required: true
