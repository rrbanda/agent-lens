name: Bug report
description: Something is broken or incorrect
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OpenShift / RHOAI / Python / MLflow versions if known
      value: |
        - OpenShift:
        - RHOAI:
        - Python:
        - MLflow:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / evidence
      render: shell
    validations:
      required: false
