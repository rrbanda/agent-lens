name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skill-alignment:
    name: Skill ↔ official MCP allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Run skill alignment tests
        run: pytest tests/test_skill_alignment.py -v
