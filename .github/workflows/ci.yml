name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skill-alignment:
    name: Skill ↔ official MCP allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Run skill alignment tests
        run: pytest tests/test_skill_alignment.py -v

  score-scale-guard:
    name: No fake /5 Likert in skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject invented 1–5 score rubrics in skills/soul
        run: |
          set -e
          if grep -rn 'X\.X/5\|/5\.0\|>= 3\.5\|quality > 4\.0' agent-lens/skills agent-lens/soul.md; then
            echo "Found legacy /5 Likert scoring language — use pass rates instead" >&2
            exit 1
          fi
          echo "OK: no /5 Likert rubrics in skills/soul"

  kustomize:
    name: Kustomize build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"
      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/
      - name: Build manifests
        run: |
          kustomize build --load-restrictor LoadRestrictionsNone agent-lens/deploy >/tmp/out.yaml
          grep -n 'analyze-session\|agent-lens-entrypoint\|BOOTSTRAP_DEPS' /tmp/out.yaml
          head -40 /tmp/out.yaml
