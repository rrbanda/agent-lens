[project]
name = "agent-lens"
version = "0.1.0"
description = "Enterprise agent quality evaluation platform built on MLflow"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
instrumentation = [
    "mlflow>=3.1",
    "httpx>=0.27",
    "pandas>=2.0",
]
dev = [
    "mlflow[genai]>=3.1",
    "pytest>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running MLflow server and MCP (deselect with -m 'not integration')",
    "unit: fast tests with no external dependencies",
]
