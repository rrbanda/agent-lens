apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-lens
  labels:
    app.kubernetes.io/part-of: agent-lens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-lens-mlflow-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-integration
subjects:
  - kind: ServiceAccount
    name: agent-lens
    namespace: agent-lens
