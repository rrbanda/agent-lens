apiVersion: v1
kind: Service
metadata:
  name: agent-lens-dashboard
  labels:
    app: agent-lens
    app.kubernetes.io/part-of: agent-lens
spec:
  selector:
    app: agent-lens
  ports:
    - name: dashboard
      port: 9119
      targetPort: 9119
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agent-lens
  labels:
    app: agent-lens
    app.kubernetes.io/part-of: agent-lens
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: agent-lens-dashboard
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
