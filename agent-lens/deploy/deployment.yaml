apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-lens
  labels:
    app: agent-lens
    app.kubernetes.io/name: agent-lens
    app.kubernetes.io/part-of: agent-lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-lens
  template:
    metadata:
      labels:
        app: agent-lens
    spec:
      serviceAccountName: agent-lens
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          # Prefer a baked image: `make build-agent` → quay.io/rrbanda/agent-lens:v3
          # Fallback python:3.11-slim bootstraps deps once (slower; not enterprise-preferred).
          image: python:3.11-slim
          command: ["/bin/bash", "/mnt/entrypoint/entrypoint.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          env:
            - name: HOME
              value: /tmp/work
            - name: HERMES_HOME
              value: /tmp/work/.hermes
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-lens-llm-key
                  key: api-key
            - name: PATH
              value: "/tmp/work/.local/bin:/usr/local/bin:/usr/bin:/bin"
            - name: PYTHONUSERBASE
              value: "/tmp/work/.local"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-lens-auth
                  key: api-server-key
            - name: MLFLOW_MCP_URL
              value: "http://mlflow-mcp.redhat-ods-applications.svc.cluster.local:8080/mcp"
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-lens-auth
                  key: dashboard-password
            - name: BOOTSTRAP_DEPS
              # Set to "0" when using the baked Containerfile image
              value: "1"
          ports:
            - containerPort: 18789
              name: dashboard
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
              ephemeral-storage: "3Gi"
          volumeMounts:
            - name: entrypoint
              mountPath: /mnt/entrypoint
            - name: skill-evaluate-agent
              mountPath: /mnt/skill-evaluate-agent
            - name: skill-review-trace
              mountPath: /mnt/skill-review-trace
            - name: skill-create-regression
              mountPath: /mnt/skill-create-regression
            - name: skill-trace-explorer
              mountPath: /mnt/skill-trace-explorer
            - name: skill-quality-dashboard
              mountPath: /mnt/skill-quality-dashboard
            - name: skill-analyze-session
              mountPath: /mnt/skill-analyze-session
            - name: soul
              mountPath: /mnt/soul
            - name: config
              mountPath: /mnt/config
            - name: hermes-data
              mountPath: /persistent
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: entrypoint
          configMap:
            name: agent-lens-entrypoint
            defaultMode: 0755
        - name: skill-evaluate-agent
          configMap:
            name: skill-evaluate-agent
        - name: skill-review-trace
          configMap:
            name: skill-review-trace
        - name: skill-create-regression
          configMap:
            name: skill-create-regression
        - name: skill-trace-explorer
          configMap:
            name: skill-trace-explorer
        - name: skill-quality-dashboard
          configMap:
            name: skill-quality-dashboard
        - name: skill-analyze-session
          configMap:
            name: skill-analyze-session
        - name: soul
          configMap:
            name: agent-lens-soul
        - name: config
          configMap:
            name: agent-lens-config
        - name: hermes-data
          persistentVolumeClaim:
            claimName: agent-lens-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
