apiVersion: v1
kind: Service
metadata:
  name: agent-lens-adk
  labels:
    app: agent-lens-adk
    app.kubernetes.io/part-of: agent-lens
    agent-lens/harness: adk
spec:
  selector:
    app: agent-lens-adk
  ports:
    - name: api
      port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agent-lens-adk
  labels:
    app: agent-lens-adk
    app.kubernetes.io/part-of: agent-lens
    agent-lens/harness: adk
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: agent-lens-adk
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
