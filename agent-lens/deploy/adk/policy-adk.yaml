# OpenShell local sandbox policy for Agent Lens (Google ADK + LiteLlm + MLflow MCP).
# LiteLlm routes to any OpenAI-compatible endpoint — inference egress is via HTTPS.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /var/log
    - /proc
    - /dev/urandom
    - /opt/openshell
    - /opt/app-root
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /mnt
    - /run

landlock:
  compatibility: best_effort

process:
  run_as_user: ""
  run_as_group: ""

network_policies:
  mlflow_mcp:
    name: MLflow MCP server
    endpoints:
      - host: mlflow-mcp.redhat-ods-applications.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  llm_inference:
    name: LLM inference (any OpenAI-compatible endpoint)
    endpoints:
      - host: "*.svc.cluster.local"
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: "*.svc.cluster.local"
        port: 8000
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  external_llm:
    name: External LLM APIs (Gemini, OpenAI, Azure, etc.)
    endpoints:
      - host: generativelanguage.googleapis.com
        port: 443
      - host: api.openai.com
        port: 443
      - host: "*.openai.azure.com"
        port: 443
    binaries:
      - path: /**

  openshell_gateway:
    name: OpenShell gateway
    endpoints:
      - host: openshell.openshell.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  cluster_dns:
    name: Cluster DNS
    endpoints:
      - host: "172.30.0.10"
        port: 53
      - host: "172.30.0.10"
        port: 5353
    binaries:
      - path: /**
