apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-lens

resources:
  - namespace.yaml
  - pvc.yaml
  - rbac.yaml
  # secret-auth.yaml is a template only — create via `make secret`
  - imagestream.yaml
  - buildconfig.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

configMapGenerator:
  - name: agent-lens-entrypoint
    files:
      - entrypoint.sh=entrypoint.sh
  - name: skill-evaluate-agent
    files:
      - SKILL.md=../skills/evaluate-agent/SKILL.md
  - name: skill-review-trace
    files:
      - SKILL.md=../skills/review-trace/SKILL.md
  - name: skill-create-regression
    files:
      - SKILL.md=../skills/create-regression/SKILL.md
  - name: skill-trace-explorer
    files:
      - SKILL.md=../skills/trace-explorer/SKILL.md
  - name: skill-quality-dashboard
    files:
      - SKILL.md=../skills/quality-dashboard/SKILL.md
  - name: skill-analyze-session
    files:
      - SKILL.md=../skills/analyze-session/SKILL.md
  - name: agent-lens-soul
    files:
      - SOUL.md=../soul.md
  - name: agent-lens-config
    files:
      - config.yaml=../config.yaml

generatorOptions:
  disableNameSuffixHash: true
