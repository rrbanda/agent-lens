[project]
name = "agent-lens-adk"
version = "0.1.0"
description = "Agent Lens — Google ADK harness for AI agent evaluation."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.30.0",
    "google-adk>=2.0.0a1",
    "mcp>=1.0.0",
    "litellm>=1.50.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
tracing = [
    "mlflow>=3.10.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adk*"]

[tool.uv]
override-dependencies = [
    "starlette>=1.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
