model:
  default: "gemini-2.5-flash"
  provider: gemini
mcp_servers:
  mlflow:
    # Always use upstream official MLflow MCP (mlflow mcp run), never Agent Lens FastMCP.
    url: "http://mlflow-mcp.redhat-ods-applications.svc.cluster.local:8080/mcp"
    timeout: 180
    connect_timeout: 60
    supports_parallel_tool_calls: true
    tools:
      resources: false
      prompts: false
      include:
        - search_experiments
        - get_experiment
        - search_traces
        - get_trace
        - log_trace_feedback
        - log_trace_expectation
        - set_trace_tag
        - evaluate_traces
        - list_runs
        - describe_run
        - list_scorers
dashboard:
  basic_auth:
    username: admin
    password_hash: "PLACEHOLDER"
platforms:
  api_server:
    enabled: true
    extra:
      port: 8642
      # Overridden at runtime from Secret agent-lens-auth / API_SERVER_KEY when supported.
      key: "PLACEHOLDER"
  webhook:
    enabled: false
gateway:
  enabled: true
tools:
  code_execution:
    enabled: "on"
    backend: local
  file_operations:
    enabled: "on"
  web_search:
    enabled: "off"
  browser:
    enabled: "off"
toolsets:
  skills: true
  memory: true
  session_search: true
  delegation: true
  cronjob: false
  kanban: false
delegation:
  max_concurrent_children: 3
memory:
  enabled: true
  providers: []
skills:
  enabled: true
  directory: /tmp/work/.hermes/skills
  curator:
    enabled: true
# Prefer Secret-injected API_SERVER_KEY in the Deployment over this placeholder.
api_server_key: "PLACEHOLDER"
