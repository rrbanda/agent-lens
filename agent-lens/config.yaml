model:
  default: "gemini/models/gemini-2.5-flash"
  base_url: "http://llamastack-service.llamastack.svc:8321/v1"
  provider: custom
  api_key: "not-needed"
mcp_servers:
  mlflow:
    url: "http://mlflow-mcp.redhat-ods-applications.svc.cluster.local:8080/mcp"
    timeout: 180
    connect_timeout: 60
    supports_parallel_tool_calls: true
    tools:
      resources: false
      prompts: false
      include:
        - search_experiments
        - get_experiment
        - search_traces
        - get_trace
        - log_trace_feedback
        - log_trace_expectation
        - set_trace_tag
        - evaluate_traces
        - list_runs
        - describe_run
        - list_scorers
gateway:
  enabled: true
tools:
  code_execution:
    enabled: "on"
    backend: local
  file_operations:
    enabled: "on"
  web_search:
    enabled: "off"
  browser:
    enabled: "off"
toolsets:
  skills: true
  memory: true
  session_search: true
  delegation: true
  cronjob: false
  kanban: false
delegation:
  max_concurrent_children: 3
memory:
  enabled: true
  providers: []
skills:
  enabled: true
  directory: /sandbox/.hermes/skills
  curator:
    enabled: true
