model:
  default: "gemini/models/gemini-2.5-flash"
  base_url: "http://llamastack-service.llamastack.svc:8321/v1"
  provider: custom
  api_key: "not-needed"
mcp_servers:
  mlflow:
    url: "http://mlflow-mcp.redhat-ods-applications.svc.cluster.local:8080/mcp"
    timeout: 180
    connect_timeout: 60
    supports_parallel_tool_calls: true
    tools:
      resources: false
      prompts: false
      include:
        # --- Official MLflow MCP tools (verified against mlflow[mcp] 3.14) ---
        # Observability
        - search_experiments
        - get_experiment
        - search_traces
        - get_trace
        - list_runs
        - describe_run
        # Evaluation
        - evaluate_traces
        - list_scorers
        # Annotation
        - log_trace_feedback
        - log_trace_expectation
        - set_trace_tag
        - delete_trace_tag
        # Assessment
        - get_trace_assessment
        - update_trace_assessment
        - delete_trace_assessment
        # Scorer management
        - register_llm_judge_scorer
        # Run-trace association
        - link_traces_to_run
        # Lifecycle management
        - delete_traces
        - create_run
        - create_experiment
gateway:
  enabled: true
tools:
  code_execution:
    enabled: "on"
    backend: local
  file_operations:
    enabled: "on"
  web_search:
    enabled: "off"
  browser:
    enabled: "off"
toolsets:
  skills: true
  memory: true
  session_search: true
  delegation: true
  cronjob: false
  kanban: false
delegation:
  max_concurrent_children: 3
memory:
  enabled: true
  providers: []
skills:
  enabled: true
  directory: /sandbox/.hermes/skills
  curator:
    enabled: true
